[package]
name = "bhss-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "bhssd: BHSS regtest node (chain state, mempool, miner/prover, gossip P2P, JSON-RPC)"

[[bin]]
name = "bhssd"
path = "src/main.rs"

[dependencies]
bhss-primitives = { workspace = true, features = ["std", "serde", "address"] }
bhss-consensus = { workspace = true, features = ["std"] }
bhss-prover = { workspace = true }
bhss-snapshot = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true, features = ["std"] }

[dev-dependencies]
bhss-slhdsa = { workspace = true }
