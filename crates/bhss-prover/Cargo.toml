[package]
name = "bhss-prover"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-side RISC Zero proving and receipt verification for BHSS blocks and migrations"

[dependencies]
bhss-primitives = { workspace = true, features = ["std"] }
bhss-consensus = { workspace = true, features = ["std"] }
bhss-legacy = { workspace = true, features = ["std"] }
bhss-methods = { workspace = true }
risc0-zkvm = { workspace = true, features = ["std", "prove"] }
bincode = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[features]
# `make prove`: generate a real STARK for a small block (slow on CPU).
real-proof-tests = []

[dev-dependencies]
bhss-smt = { workspace = true }
bhss-slhdsa = { workspace = true }
bhss-legacy = { workspace = true, features = ["sign"] }
k256 = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true }
