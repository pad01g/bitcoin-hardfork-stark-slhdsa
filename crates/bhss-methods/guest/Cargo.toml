[package]
name = "bhss-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
risc0-zkvm = { version = "3.0", default-features = false, features = ["std"] }
bhss-primitives = { path = "../../bhss-primitives" }
bhss-consensus = { path = "../../bhss-consensus" }
bhss-legacy = { path = "../../bhss-legacy" }

# RISC Zero accelerated forks (SHA-256 precompile; secp256k1 via bigint2).
[patch.crates-io]
slh-dsa = { path = "../../../vendor/slh-dsa" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.3-risczero.1" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
