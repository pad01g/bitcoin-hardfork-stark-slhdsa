[package]
name = "bhss-snapshot"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Builds the BHSS genesis state from a Bitcoin Core dumptxoutset file or synthetic coins"

[dependencies]
bhss-primitives = { workspace = true, features = ["std", "serde"] }
bhss-consensus = { workspace = true, features = ["std"] }
bhss-methods = { workspace = true }
k256 = { workspace = true, features = ["std", "arithmetic"] }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true, features = ["std"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "bhss-snapshot"
path = "src/main.rs"
