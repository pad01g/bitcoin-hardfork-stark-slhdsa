[workspace]
resolver = "2"
members = [
    "crates/bhss-primitives",
    "crates/bhss-smt",
    "crates/bhss-slhdsa",
    "crates/bhss-legacy",
    "crates/bhss-consensus",
    "crates/bhss-methods",
    "crates/bhss-prover",
    "crates/bhss-node",
    "crates/bhss-cli",
    "crates/bhss-snapshot",
]
# The zkVM guest is its own workspace (separate target, separate lockfile, patched crypto crates).
exclude = ["crates/bhss-methods/guest"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pad01g/bitcoin-hardfork-stark-slhdsa"

[workspace.dependencies]
bhss-primitives = { path = "crates/bhss-primitives", default-features = false }
bhss-smt = { path = "crates/bhss-smt", default-features = false }
bhss-slhdsa = { path = "crates/bhss-slhdsa", default-features = false }
bhss-legacy = { path = "crates/bhss-legacy", default-features = false }
bhss-consensus = { path = "crates/bhss-consensus", default-features = false }
bhss-methods = { path = "crates/bhss-methods" }
bhss-prover = { path = "crates/bhss-prover" }
bhss-snapshot = { path = "crates/bhss-snapshot" }

sha2 = { version = "=0.10.8", default-features = false }
ripemd = { version = "0.1", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
slh-dsa = { version = "=0.1.0", default-features = false }
signature = { version = "2", default-features = false }
k256 = { version = "=0.13.3", default-features = false }
rand_core = { version = "0.6", default-features = false }
hashbrown = { version = "0.14", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
risc0-zkvm = { version = "3.0", default-features = false }
risc0-build = { version = "3.0" }
bincode = "1.3"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bech32 = "0.11"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
getrandom = "0.2"

[profile.release]
debug = 1
lto = "thin"

# Consensus and node code must never wrap silently: integer overflow in
# release builds aborts instead (every rule uses checked arithmetic, this is
# the safety net). Third-party crates keep the default.
[profile.release.package.bhss-primitives]
overflow-checks = true

[profile.release.package.bhss-smt]
overflow-checks = true

[profile.release.package.bhss-consensus]
overflow-checks = true

[profile.release.package.bhss-legacy]
overflow-checks = true

[profile.release.package.bhss-slhdsa]
overflow-checks = true

[profile.release.package.bhss-prover]
overflow-checks = true

[profile.release.package.bhss-node]
overflow-checks = true

[profile.release.package.bhss-cli]
overflow-checks = true

[profile.release.package.bhss-snapshot]
overflow-checks = true

[profile.release.package.bhss-methods]
overflow-checks = true

[patch.crates-io]
slh-dsa = { path = "vendor/slh-dsa" }
